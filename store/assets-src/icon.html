<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  html, body { margin: 0; background: transparent; }
  img { display: block; }
</style>
</head>
<body>
<img id="icon" src="../../assets/icon.svg" alt="">
<script>
  const size = Number(new URLSearchParams(location.search).get('size')) || 128;
  const img = document.getElementById('icon');
  img.width = size;
  img.height = size;
</script>
</body>
</html>
